[project]
name = "pandacode"
version = "0.2.0"
description = "A terminal AI coding assistant"
requires-python = ">=3.11"
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.47.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
]

[project.scripts]
pandacode = "pandacode.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pandacode"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.3.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Windows Proactor 事件循环的已知噪音：子进程管道 transport 在 GC 时
    # __del__ 内 __repr__ 访问已关闭管道（CPython 上游问题），非测试自身泄漏
    "ignore:Exception ignored in:pytest.PytestUnraisableExceptionWarning",
]
